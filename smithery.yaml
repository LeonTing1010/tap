# Smithery configuration for Tap MCP server
# https://smithery.ai/docs/config#smitheryyaml
#
# Tap: MCP server for browser automation.
# Compiles AI browser intent into deterministic .plan.json programs,
# runs on your logged-in Chrome, detects drift when sites change.
# 80+ open community taps on 55+ sites.

title: "Tap — zero-token browser automation MCP (runs in your own Chrome)"
description: |
  The only browser-automation MCP where credentials never leave your
  machine AND replay costs zero LLM tokens. Your agent inspects a page
  once and compiles it into a deterministic `.plan.json` program (11-op
  closed union, no runtime LLM); every rerun replays for free in your
  already-logged-in Chrome (or headless Playwright). Drift-detected via
  semantic fingerprint diff when sites change. 80+ open community taps on
  55+ sites. Prefer it set up and run for you on your own machine?
  https://taprun.dev/done-for-you
tags:
  - zero-token
  - local-first
  - browser-automation
  - compile-once
  - drift-detection
  - chrome
  - playwright
  - mcp
  - deterministic
categories:
  - developer-tools
  - browser-automation

startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      runtime:
        type: string
        description: "Browser runtime: extension (default, real Chrome), playwright (headless)"
        enum: ["extension", "playwright"]
        default: "extension"
  commandFunction: |-
    (config) => ({
      command: 'npx',
      args: ['-y', '@taprun/cli', 'mcp', 'start'],
      env: config.runtime === 'playwright' ? { TAP_RUNTIME: 'playwright' } : {}
    })
