name: Feature Request
description: Suggest an idea for Tap
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should this work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Core (8 operations)
        - Built-in (17 operations)
        - CLI
        - Forge
        - Doctor / Watch
        - MCP
        - Runtime
        - Other
