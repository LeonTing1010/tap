name: Bug Report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! Please fill out the details below.
  - type: input
    id: version
    attributes:
      label: Tap version
      description: "Run `tap --version`"
      placeholder: "0.6.5"
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options:
        - Chrome Extension
        - Playwright
        - macOS
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the bug
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      value: |
        1. 
        2. 
        3. 
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: "Paste `tap doctor` output or error messages"
      render: shell
