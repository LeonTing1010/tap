name: packages

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "package.json"
      - "docs/spec/plan-v1.schema.json"
      - "docs/spec/plan-v1/schema.json"
      - "docs/ns/tap-v1/**"
      - ".github/workflows/packages.yml"
  pull_request:
    paths:
      - "packages/**"
      - "package.json"
      - "docs/spec/plan-v1.schema.json"
      - "docs/spec/plan-v1/schema.json"
      - "docs/ns/tap-v1/**"

jobs:
  schema-deploy-drift:
    # Asserts the JSON Schema served at:
    #   https://taprun.dev/spec/plan-v1.schema.json    (flat — legacy URL)
    #   https://taprun.dev/spec/plan-v1/schema.json    (subdirectory — 1.2.0 $id target)
    # are both byte-equivalent to the source-of-truth in @taprun/spec.
    # The two mirrors must stay equal because the schema's own $id points at
    # the subdirectory URL — if the deploy lags, downstream validators that
    # fetch by $id resolve to the wrong revision. The flat URL is preserved
    # for pre-1.2.0 back-compat references that pinned it directly.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diff source schema vs deployed copies (flat + subdirectory)
        run: |
          set -e
          src=packages/spec/schemas/plan-v1.schema.json
          for dst in docs/spec/plan-v1.schema.json docs/spec/plan-v1/schema.json; do
            if ! diff -u "$src" "$dst"; then
              echo "::error::$dst drifted from $src — run 'npm run docs:sync-schema' and commit."
              exit 1
            fi
            echo "OK: $src == $dst"
          done

  ns-cross-consumer-only:
    # Asserts the tap-v1 namespace defines exactly the cross-consumer
    # protocol contract — no more, no less. Three-way enforcement:
    #   1) The canonical term set lives in @taprun/spec
    #      (packages/spec/src/ns-vocabulary.ts). It is type-checked at
    #      compile time, so typos / case errors fail there first.
    #   2) docs/ns/tap-v1/index.jsonld @ids must equal the canonical set.
    #   3) docs/ns/tap-v1/README.md contract tables must equal the
    #      canonical set.
    # Adding/removing a term: edit ns-vocabulary.ts AND index.jsonld AND
    # README.md together. Internal-only types (forge-time fingerprints,
    # intermediate selector candidates) cannot sneak in by being added
    # to source code without protocol intent.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build --workspace @taprun/spec --if-present
      - name: Diff ns terms (canonical vs jsonld vs README)
        run: |
          set -e
          # Source of truth: TAP_V1_NS_TERMS exported by @taprun/spec.
          # Use byte-wise sort (LC_ALL=C) everywhere so uppercase
          # ExecutionPlan and lowercase property names diff consistently.
          expected=$(node -e "
            const m = require('./packages/spec/dist/index.js');
            console.log([...m.TAP_V1_NS_TERMS].sort().join('\n'));
          " | LC_ALL=C sort)
          # @id values starting with tap: from the JSON-LD context.
          jsonld_ids=$(grep -oE '"@id":\s*"tap:[a-zA-Z_]+"' docs/ns/tap-v1/index.jsonld | grep -oE 'tap:[a-zA-Z_]+' | LC_ALL=C sort -u)
          # Terms in the README's contract tables under '## What it defines'.
          readme_terms=$(awk '/^## What it defines/{flag=1; next} /^## /{flag=0} flag' docs/ns/tap-v1/README.md \
                         | grep -oE '`tap:[a-zA-Z_]+`' | grep -oE 'tap:[a-zA-Z_]+' | LC_ALL=C sort -u)

          fail=0
          if ! diff -u <(echo "$expected") <(echo "$jsonld_ids") >/tmp/diff_jsonld 2>&1; then
            echo "::error::index.jsonld term set differs from @taprun/spec TAP_V1_NS_TERMS:"
            cat /tmp/diff_jsonld
            fail=1
          fi
          if ! diff -u <(echo "$expected") <(echo "$readme_terms") >/tmp/diff_readme 2>&1; then
            echo "::error::README.md term set differs from @taprun/spec TAP_V1_NS_TERMS:"
            cat /tmp/diff_readme
            fail=1
          fi
          if [ $fail -eq 1 ]; then
            echo
            echo "Adding a term: edit packages/spec/src/ns-vocabulary.ts AND docs/ns/tap-v1/{index.jsonld,README.md} together."
            echo "Removing a term: mark owl:deprecated in jsonld + README, keep it in ns-vocabulary.ts with a // deprecated comment."
            exit 1
          fi
          echo "OK: @taprun/spec TAP_V1_NS_TERMS == index.jsonld == README.md"
          echo "    ($(echo "$expected" | wc -l | tr -d ' ') terms)"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build --workspaces --if-present
      - run: npm test --workspaces --if-present

  pack-dryrun:
    # Runs `npm pack --dry-run` per workspace to catch publish-time
    # failures (missing files, broken exports map, file: refs that
    # leaked into devDependencies).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build --workspaces --if-present
      - name: pack-dryrun all packages
        run: |
          set -e
          for pkg in spec from-playwright from-puppeteer from-stagehand create-tap-script; do
            echo "=== $pkg ==="
            cd packages/$pkg
            # Fail loud if package.json contains 'file:' (would corrupt npm registry)
            if grep -q '"file:' package.json; then
              echo "ERROR: $pkg/package.json contains a file: reference. Forbidden in publishable packages."
              exit 1
            fi
            npm pack --dry-run
            cd ../..
          done
