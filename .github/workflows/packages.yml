name: packages

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "package.json"
      - "docs/spec/plan-v1.schema.json"
      - ".github/workflows/packages.yml"
  pull_request:
    paths:
      - "packages/**"
      - "package.json"
      - "docs/spec/plan-v1.schema.json"

jobs:
  schema-deploy-drift:
    # Asserts the JSON Schema served at https://taprun.dev/spec/plan-v1.schema.json
    # is byte-equivalent to the source-of-truth in @taprun/spec. The two files
    # must stay equal because the schema's own $id points at the deployed URL —
    # if the deploy lags, downstream validators that fetch by $id resolve to
    # the wrong revision.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diff source schema vs deployed copy
        run: |
          set -e
          src=packages/spec/schemas/plan-v1.schema.json
          dst=docs/spec/plan-v1.schema.json
          if ! diff -u "$src" "$dst"; then
            echo "::error::$dst drifted from $src — run 'cp $src $dst' and commit."
            exit 1
          fi
          echo "OK: $src == $dst"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build --workspaces --if-present
      - run: npm test --workspaces --if-present

  pack-dryrun:
    # Runs `npm pack --dry-run` per workspace to catch publish-time
    # failures (missing files, broken exports map, file: refs that
    # leaked into devDependencies).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build --workspaces --if-present
      - name: pack-dryrun all packages
        run: |
          set -e
          for pkg in spec from-playwright from-puppeteer from-stagehand create-tap-script; do
            echo "=== $pkg ==="
            cd packages/$pkg
            # Fail loud if package.json contains 'file:' (would corrupt npm registry)
            if grep -q '"file:' package.json; then
              echo "ERROR: $pkg/package.json contains a file: reference. Forbidden in publishable packages."
              exit 1
            fi
            npm pack --dry-run
            cd ../..
          done
