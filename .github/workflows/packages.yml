name: packages

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "package.json"
      - "docs/spec/plan-v1.schema.json"
      - "docs/ns/tap-v1/**"
      - ".github/workflows/packages.yml"
  pull_request:
    paths:
      - "packages/**"
      - "package.json"
      - "docs/spec/plan-v1.schema.json"
      - "docs/ns/tap-v1/**"

jobs:
  schema-deploy-drift:
    # Asserts the JSON Schema served at https://taprun.dev/spec/plan-v1.schema.json
    # is byte-equivalent to the source-of-truth in @taprun/spec. The two files
    # must stay equal because the schema's own $id points at the deployed URL —
    # if the deploy lags, downstream validators that fetch by $id resolve to
    # the wrong revision.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diff source schema vs deployed copy
        run: |
          set -e
          src=packages/spec/schemas/plan-v1.schema.json
          dst=docs/spec/plan-v1.schema.json
          if ! diff -u "$src" "$dst"; then
            echo "::error::$dst drifted from $src — run 'cp $src $dst' and commit."
            exit 1
          fi
          echo "OK: $src == $dst"

  ns-cross-consumer-only:
    # Asserts the tap-v1 namespace defines exactly the cross-consumer
    # protocol contract — no more, no less. Two-way enforcement:
    #   1) Every term defined in index.jsonld must be listed in README.md
    #      (so the human-readable doc and the machine-readable context
    #      cannot drift).
    #   2) Both must match the canonical 13-term set encoded below. New
    #      terms require an explicit edit here, which forces a code
    #      review on the protocol surface — internal-only types
    #      (forge-time fingerprints, intermediate selector candidates)
    #      cannot sneak in by being added to source code without
    #      protocol intent.
    # The 13 terms below = exactly what core actually emits in a stored
    # .tap.json envelope or a doctor `assessing` annotation body.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diff ns terms (jsonld vs README vs canonical set)
        run: |
          set -e
          # Canonical: terms that ship across a consumer boundary.
          # When adding a term: edit this list AND index.jsonld AND README.md.
          # When removing: edit this list AND mark deprecated in index.jsonld + README.md.
          expected=$(cat <<'TERMS' | sort
          tap:executing
          tap:ExecutionPlan
          tap:site
          tap:name
          tap:intent
          tap:health
          tap:args
          tap:verdict
          tap:compiledFromLayer
          tap:recommendedLayer
          tap:crossValidation
          tap:suggestions
          tap:suggestAuthoritative
          TERMS
          )
          # Extract @id values starting with tap: from the JSON-LD context.
          jsonld_ids=$(grep -oE '"@id":\s*"tap:[a-zA-Z_]+"' docs/ns/tap-v1/index.jsonld | grep -oE 'tap:[a-zA-Z_]+' | sort -u)
          # Extract terms in the README's two contract tables (lines that wrap a tap:* in backticks under '## What it defines').
          readme_terms=$(awk '/^## What it defines/{flag=1; next} /^## /{flag=0} flag' docs/ns/tap-v1/README.md \
                         | grep -oE '`tap:[a-zA-Z_]+`' | grep -oE 'tap:[a-zA-Z_]+' | sort -u)

          fail=0
          if ! diff -u <(echo "$expected") <(echo "$jsonld_ids") >/tmp/diff_jsonld 2>&1; then
            echo "::error::index.jsonld term set differs from canonical:"
            cat /tmp/diff_jsonld
            fail=1
          fi
          if ! diff -u <(echo "$expected") <(echo "$readme_terms") >/tmp/diff_readme 2>&1; then
            echo "::error::README.md term set differs from canonical:"
            cat /tmp/diff_readme
            fail=1
          fi
          if [ $fail -eq 1 ]; then
            echo
            echo "Adding a term: update this guard, index.jsonld, and README.md together."
            echo "Removing a term: mark owl:deprecated in jsonld + README, keep it in this list with a # deprecated comment."
            exit 1
          fi
          echo "OK: ns canonical (13 terms) == index.jsonld == README.md"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build --workspaces --if-present
      - run: npm test --workspaces --if-present

  pack-dryrun:
    # Runs `npm pack --dry-run` per workspace to catch publish-time
    # failures (missing files, broken exports map, file: refs that
    # leaked into devDependencies).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build --workspaces --if-present
      - name: pack-dryrun all packages
        run: |
          set -e
          for pkg in spec from-playwright from-puppeteer from-stagehand create-tap-script; do
            echo "=== $pkg ==="
            cd packages/$pkg
            # Fail loud if package.json contains 'file:' (would corrupt npm registry)
            if grep -q '"file:' package.json; then
              echo "ERROR: $pkg/package.json contains a file: reference. Forbidden in publishable packages."
              exit 1
            fi
            npm pack --dry-run
            cd ../..
          done
