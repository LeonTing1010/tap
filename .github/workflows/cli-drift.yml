name: cli-drift

# Lint gate: surfaces that promise install/MCP-startup commands must match
# docs/_data/cli.yml (canonical, see file header). Fills the "DRIFT GUARDS (TODO)"
# gap declared in cli.yml itself. Two jobs:
#
#   in-repo    — hard gate on PRs touching any cited surface. Fast, no network.
#   cross-repo — fetches GH releases / npm registry / homebrew formula. Annotates
#                only; soft on network failure. Required to pass on push to main.

on:
  pull_request:
    paths:
      - "docs/_data/cli.yml"
      - "extension/manifest.json"
      - "extension/description.txt"
      - "README.md"
      - "packages/*/README.md"
      - "packages/*/package.json"
      - "scripts/lint-cli-drift.ts"
      - ".github/workflows/cli-drift.yml"
  push:
    branches: [main]
    paths:
      - "docs/_data/cli.yml"
  schedule:
    # Daily at 13:00 UTC catches downstream drift (formula not bumped, npm
    # not republished) even when no PR touches cli.yml.
    - cron: "0 13 * * *"
  workflow_dispatch:

jobs:
  in-repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v1
        with: { deno-version: v2.x }
      - name: Drift check (in-repo only)
        run: deno run --allow-read scripts/lint-cli-drift.ts --in-repo-only

  cross-repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v1
        with: { deno-version: v2.x }
      - name: Drift check (cross-repo)
        run: |
          deno run \
            --allow-read \
            --allow-net=raw.githubusercontent.com,api.github.com,registry.npmjs.org \
            scripts/lint-cli-drift.ts
