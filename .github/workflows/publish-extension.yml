name: Publish Extension to Chrome Web Store

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Layer 4 gate (2026-07-22): the full op matrix dispatched through the REAL
  # MV3 service worker before anything reaches the store. Exists because
  # 0.22.0 shipped with a runtime import() in the SW — every resolver op
  # (op:input, op:wait{selector}) dead in the field — while all Node-side
  # test layers stayed green (none of them execute the SW). Text asserts
  # can't see runtime-context violations; this job runs them for real.
  op-matrix:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension/e2e
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/e2e/package-lock.json
      - name: Install npm deps (@playwright/test)
        run: npm install
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('extension/e2e/package-lock.json') }}
      - name: Install Chromium + system deps (xvfb etc.)
        run: npx playwright install --with-deps chromium
      - name: Run op-matrix against the real SW (headed under xvfb)
        run: xvfb-run -a npx playwright test op-matrix

  publish:
    needs: op-matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Read version from manifest
        id: version
        run: |
          VERSION=$(jq -r '.version' extension/manifest.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches manifest version
        # Skip on manual dispatch — `gh workflow run` runs from a branch ref
        # (e.g. `main`), not a tag, so there's no tag version to compare
        # against. The check still gates the auto-release tag-push path.
        if: github.event_name == 'push'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION="${{ steps.version.outputs.version }}"
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::Tag $TAG_VERSION does not match manifest version $MANIFEST_VERSION"
            exit 1
          fi

      - name: Package extension
        # Exclude internal-only files: dotfiles, the test/ harness (Node-side
        # tests, never executed in the extension runtime), the developer-facing
        # TESTING.md, the CWS store-listing source-of-truth files
        # (description.txt + STORE_LISTING.md are for the dashboard submission,
        # not for end users), and the SVG icon source (manifest only references
        # PNGs).
        run: |
          cd extension
          zip -r ../tap-extension-${{ steps.version.outputs.version }}.zip . \
            -x '.*' 'test/*' 'TESTING.md' 'description.txt' 'STORE_LISTING.md' 'icons/icon.svg' 'cn/*'

      - name: Attach extension to the existing release
        # This job must NEVER create the release. core's Release workflow owns
        # it and attaches the engine binaries + tap.mcpb + SHA256SUMS.
        #
        # It used to run softprops/action-gh-release here, which creates the
        # release when absent. On 2026-07-15 core's release workflow never ran
        # for v0.20.8, so this step became the creator and published an orphan
        # release carrying ONLY the extension zip. That release took over
        # `latest`, which 404'd every releases/latest/download/* URL for four
        # days — install.sh's binary fallback and the tap.mcpb download button
        # included.
        #
        # `gh release upload` fails when the release is missing. Failing loudly
        # is the point: a missing core release is a release-pipeline bug, and
        # silently inventing a half-empty release hides it.
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG does not exist. core's Release workflow must publish it (binaries + tap.mcpb) before the extension can be attached. Refusing to create an orphan release."
            exit 1
          fi
          gh release upload "$TAG" \
            "tap-extension-${{ steps.version.outputs.version }}.zip" --clobber

      - name: Upload and publish to Chrome Web Store
        # chrome-webstore-upload-cli ≥3.x removed --client-id / --client-secret /
        # --refresh-token flags (see fregante/chrome-webstore-upload-cli#80).
        # Values now MUST be passed via env vars CLIENT_ID / CLIENT_SECRET /
        # REFRESH_TOKEN. --extension-id flag is preserved.
        #
        # CLI pinned to 3.5.0 — the last 3.x release. 4.0.0 (2026-05-12) bumped
        # `chrome-webstore-upload` to ^6 which requires a new `publisherId`
        # option (CWS PartnerDashV4 API). `PUBLISHER_ID` env is wired in below
        # so removing the pin later only requires creating the secret.
        env:
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
        run: |
          npm install -g chrome-webstore-upload-cli@3.5.0
          chrome-webstore-upload upload \
            --source tap-extension-${{ steps.version.outputs.version }}.zip \
            --extension-id '${{ secrets.CHROME_EXTENSION_ID }}' \
            --auto-publish
