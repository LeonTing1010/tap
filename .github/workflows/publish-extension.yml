name: Publish Extension to Chrome Web Store

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version from manifest
        id: version
        run: |
          VERSION=$(jq -r '.version' extension/manifest.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches manifest version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION="${{ steps.version.outputs.version }}"
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::Tag $TAG_VERSION does not match manifest version $MANIFEST_VERSION"
            exit 1
          fi

      - name: Package extension
        run: |
          cd extension
          zip -r ../tap-extension-${{ steps.version.outputs.version }}.zip . -x '.*'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: tap-extension-${{ steps.version.outputs.version }}.zip
          generate_release_notes: true

      - name: Upload and publish to Chrome Web Store
        run: |
          npm install -g chrome-webstore-upload-cli
          chrome-webstore-upload upload \
            --source tap-extension-${{ steps.version.outputs.version }}.zip \
            --extension-id ${{ secrets.CHROME_EXTENSION_ID }} \
            --auto-publish
        env:
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
