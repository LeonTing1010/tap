name: Publish Extension to Chrome Web Store

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Read version from manifest
        id: version
        run: |
          VERSION=$(jq -r '.version' extension/manifest.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches manifest version
        # Skip on manual dispatch — `gh workflow run` runs from a branch ref
        # (e.g. `main`), not a tag, so there's no tag version to compare
        # against. The check still gates the auto-release tag-push path.
        if: github.event_name == 'push'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION="${{ steps.version.outputs.version }}"
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::Tag $TAG_VERSION does not match manifest version $MANIFEST_VERSION"
            exit 1
          fi

      - name: Package extension
        # Exclude internal-only files: dotfiles, the test/ harness (Node-side
        # tests, never executed in the extension runtime), the developer-facing
        # TESTING.md, the CWS store-listing copy (description.txt is for the
        # store, not the extension package), and the SVG icon source (manifest
        # only references PNGs).
        run: |
          cd extension
          zip -r ../tap-extension-${{ steps.version.outputs.version }}.zip . \
            -x '.*' 'test/*' 'TESTING.md' 'description.txt' 'icons/icon.svg'

      - name: Create GitHub Release
        # softprops/action-gh-release needs a tag ref; on workflow_dispatch
        # we run from a branch and don't want to fabricate a duplicate release
        # (the v* release already exists, created by core's Release workflow).
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: tap-extension-${{ steps.version.outputs.version }}.zip
          generate_release_notes: true

      - name: Upload and publish to Chrome Web Store
        # chrome-webstore-upload-cli ≥3.x removed --client-id / --client-secret /
        # --refresh-token flags (see fregante/chrome-webstore-upload-cli#80).
        # Values now MUST be passed via env vars CLIENT_ID / CLIENT_SECRET /
        # REFRESH_TOKEN. --extension-id flag is preserved.
        env:
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: |
          npm install -g chrome-webstore-upload-cli
          chrome-webstore-upload upload \
            --source tap-extension-${{ steps.version.outputs.version }}.zip \
            --extension-id '${{ secrets.CHROME_EXTENSION_ID }}' \
            --auto-publish
