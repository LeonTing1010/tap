name: golden-replay

# Layer 2 — CLI golden-replay against credential-free public APIs. Validates
# end-to-end that the Tap binary can fetch real substrate data and that
# per-tap op.expect predicates still pass against today's API shape.
#
# Catches what the contract layer can't: a substrate site renaming a JSON
# field, returning empty arrays, or moving an endpoint. Each plan's
# op.expect is the per-tap drift assertion (per ADR 2026-05-08 §2B);
# this workflow exercises that mechanism against live HTTP.
#
# Trigger: nightly cron (catch site-side drift even when no Tap change)
# + workflow_dispatch. NOT a PR gate — real network = flake risk + 2-3s
# per plan = 10-30s wall time at scale, too slow for every PR.
#
# Trusts the CLI exit code: drift fires op.expect → runtime aborts the Run
# → tapRegistry.run.handler classifies as tap_drifted → CLI exits 1
# (per tap-core fix 5821d63 to runPlanForCli delegation).

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

jobs:
  replay:
    strategy:
      fail-fast: false
      matrix:
        plan:
          - hn/top
          - hn/newest_ids
          - github/stagehand-recent-issues
          - npm/taprun-cli
          - algolia/hn-search
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Replay ${{ matrix.plan }}
        # Plan fixtures live under test/golden-replay/plans/<site>/<name>.plan.json
        # (mirrors ~/.tap/plans/ layout) and are pointed at via TAP_HOME so the
        # CLI loads them without polluting user state. Drift in any op.expect
        # surfaces as exit 1 with a tap_drifted envelope on stdout.
        run: |
          TAP_HOME="$PWD/test/golden-replay" \
            npx -y @taprun/cli "${{ matrix.plan }}"
