<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0a0918; color: #e0e0e0; line-height: 1.8; }
.container { max-width: 760px; margin: 0 auto; padding: 60px 24px; }
h1 { font-size: 2rem; font-weight: 600; color: #fff; margin-bottom: 8px; line-height: 1.3; }
h2 { font-size: 1.35rem; font-weight: 500; color: #fff; margin-top: 48px; margin-bottom: 16px; }
h3 { font-size: 1.1rem; font-weight: 500; color: #fff; margin-top: 32px; margin-bottom: 12px; }
p, li { font-size: 0.95rem; color: #b0b0b0; margin-bottom: 16px; }
ul, ol { padding-left: 24px; }
a { color: #818cf8; text-decoration: none; }
a:hover { text-decoration: underline; }
.meta { font-size: 0.85rem; color: #666; margin-bottom: 40px; }
.back { display: inline-block; margin-bottom: 24px; font-size: 0.9rem; }
code { background: #1a1a2e; padding: 2px 6px; border-radius: 4px; font-size: 0.9em; font-family: 'JetBrains Mono', monospace; }
pre { background: #111118; border: 1px solid #222; border-radius: 8px; padding: 16px 20px; overflow-x: auto; margin: 20px 0; font-family: 'JetBrains Mono', monospace; font-size: 0.88rem; line-height: 1.6; color: #c8c8d0; }
pre .comment { color: #555; }
pre .cmd { color: #818cf8; }
pre .output { color: #6ee7b7; }
pre .flag { color: #fbbf24; }
pre .err { color: #f87171; }
blockquote { border-left: 3px solid #6366F1; padding: 12px 16px; margin: 20px 0; background: rgba(99,102,241,0.06); border-radius: 0 8px 8px 0; }
blockquote p { color: #a0a0b0; margin-bottom: 0; font-style: italic; }
blockquote cite { display: block; margin-top: 8px; font-size: 0.85rem; color: #666; font-style: normal; }
.cta { margin-top: 48px; padding: 24px; background: rgba(99,102,241,0.08); border: 1px solid rgba(99,102,241,0.2); border-radius: 12px; }
.cta h3 { color: #fff; font-size: 1.1rem; margin-bottom: 12px; margin-top: 0; }
.cta pre { margin-bottom: 0; }
hr { border: none; border-top: 1px solid #222; margin: 48px 0; }
table { width: 100%; margin: 20px 0; border-collapse: collapse; font-size: 0.9rem; }
th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #222; color: #b0b0b0; }
th { color: #fff; font-weight: 500; background: rgba(99,102,241,0.05); }
td code { font-size: 0.85em; }
.rule-box { background: rgba(239,68,68,0.06); border: 1px solid rgba(239,68,68,0.2); border-radius: 8px; padding: 16px 20px; margin: 24px 0; }
.rule-box strong { color: #fca5a5; }
</style>
