url: https://taprun.dev
title: Tap
description: Browser automation that runs in your browser, not someone else's cloud. Compile once, run forever, diff the drift.
author:
  name: Leon Ting
  url: https://github.com/LeonTing1010

plugins:
  - jekyll-sitemap

include:
  - .well-known

# Verification & utility files: keep them served, but keep them out of the
# sitemap so SEO tooling (Ahrefs, GSC) doesn't flag them as orphan/missing-meta.
defaults:
  - scope:
      path: "google*.html"
    values:
      sitemap: false
  - scope:
      path: "BingSiteAuth.xml"
    values:
      sitemap: false
  - scope:
      path: "tap*.txt"
    values:
      sitemap: false
  - scope:
      path: "e9ea3504983ec21b5c929ae5018ac153.txt"
    values:
      sitemap: false
  # Tap detail pages: noindex'd via _layouts/tap.html (template-heavy, low
  # unique content). Drop from sitemap so Google doesn't waste crawl budget
  # — diagnosed 2026-05-11 via GSC: 76 tap pages → ~112 not-indexed URLs.
  - scope:
      path: "taps"
    values:
      sitemap: false
  # Restore the /taps/ listing page — only per-tap detail pages are noindex'd.
  - scope:
      path: "taps/index.html"
    values:
      sitemap: true
