<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Taprun</title>
  <style>
    :root { color-scheme: light dark; --accent: #6f42c1; }
    body { font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; margin: 0; padding: 12px; }
    h1 { font-size: 14px; margin: 0 0 4px; display: flex; align-items: center; gap: 6px; }
    h1 .dot { width: 8px; height: 8px; border-radius: 50%; background: #9aa0a6; }
    h1 .dot.live { background: #1a9e5f; }
    .sub { color: #9aa0a6; margin: 0 0 12px; }
    section { border: 1px solid rgba(128,128,128,.25); border-radius: 8px; padding: 10px; margin-bottom: 10px; }
    section h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: #9aa0a6; margin: 0 0 6px; }
    code { background: rgba(128,128,128,.14); padding: 1px 4px; border-radius: 4px; word-break: break-all; }
    .row { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; }
    .muted { color: #9aa0a6; }
    button { font: inherit; padding: 4px 8px; border: 1px solid rgba(128,128,128,.35); border-radius: 6px; background: transparent; cursor: pointer; }
    #picked { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1><span class="dot" id="bridgeDot"></span> Taprun</h1>
  <p class="sub" id="bridgeState">checking bridge…</p>

  <!-- The panel shows ONLY SW-observable, truthful state: bridge liveness,
       the last picked resolver, and plan→human notify messages. "Current run"
       + "Recent taps" were removed (2026-07-08): a whole-plan run is not
       SW-observable (the host runs the plan; the SW sees only per-op calls), so
       those boxes were permanent misleading placeholders — the same lie-class
       as the bridge false-negative. Re-add them via a host→SW run-state push
       only when a real consumer needs live run status (e.g. long background
       runs), and build it with the plan ref/state then. -->
  <section>
    <h2>Last picked element → resolver</h2>
    <div id="picked" class="muted">Right-click any element → “Taprun: pick this element → resolver”.</div>
    <div style="margin-top:8px"><button id="copyPicked">Copy resolver JSON</button></div>
  </section>

  <script src="sidepanel.js"></script>
</body>
</html>
